<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="robots" content="noindex, follow" />
    <title>404: Sidan hittades inte | Prospectly</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f8fafc;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .box {
        max-width: 500px;
        padding: 40px 24px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        border: 1px solid #e2e8f0;
      }
      h1 {
        font-size: 4.5rem;
        margin: 0;
        color: #1F3A5F;
        line-height: 1;
        font-weight: 800;
      }
      h2 {
        font-size: 1.4rem;
        margin: 16px 0 8px;
        color: #091322;
      }
      p {
        color: #64748b;
        font-size: 1rem;
        margin: 12px 0 28px;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        background: #2E7D5B;
        color: #ffffff;
        text-decoration: none;
        padding: 12px 28px;
        border-radius: 8px;
        font-weight: 600;
        transition: background 0.2s, transform 0.2s;
      }
      a:hover {
        background: #24684a;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="/images/logo-prospectly.png" alt="Prospectly" style="max-height: 36px; margin: 0 auto 24px auto;" />
      <h1>404</h1>
      <h2>Sidan kunde inte hittas</h2>
      <p>Sidan du söker finns inte eller har flyttats. Gå tillbaka till startsidan för att läsa mer om hur Prospectly fyller kalendern åt rekryteringsbolag.</p>
      <a href="/">Tillbaka till startsidan</a>
    </div>
  </body>
</html>
